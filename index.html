<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Index</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #ffffff;
            --muted: #888888;
            --card-bg: #121212;
            --border: #222222;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--accent);
            font-family: var(--font);
            display: flex;
            justify-content: center;
            padding: 4rem 2rem;
            min-height: 100vh;
        }

        main {
            width: 100%;
            max-width: 600px;
        }

        header {
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--muted);
            font-size: 0.9rem;
        }

        #status {
            color: var(--muted);
            font-size: 0.9rem;
            font-style: italic;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        li a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.95rem;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        li a:hover {
            border-color: var(--accent);
        }

        li a .arrow {
            color: var(--muted);
            font-size: 0.8rem;
            transition: transform 0.2s ease;
        }

        li a:hover .arrow {
            transform: translateX(4px);
            color: var(--accent);
        }
    </style>
</head>
<body>

    <main>
        <header>
            <h1>Personal Projects</h1>
            <p id="status">Scanning repository...</p>
        </header>

        <ul id="project-list"></ul>
    </main>

    <script>
        async function loadProjects() {
            const statusEl = document.getElementById('status');
            const listEl = document.getElementById('project-list');
            
            // Extract username and repository name from the current github.io URL
            const hostname = window.location.hostname;
            const pathname = window.location.pathname;
            
            const isCustomDomain = !hostname.endsWith('.github.io');
            
            let user = "";
            let repo = "";

            if (isCustomDomain) {
                // HARDCODE YOUR DATA HERE IF USING A CUSTOM DOMAIN:
                // user = "your-github-username";
                // repo = "your-repo-name";
                statusEl.textContent = "Custom domain detected. Please configure user/repo in script.";
                return;
            } else {
                user = hostname.split('.')[0];
                // Extracts repo name from subfolder, or defaults to username.github.io repo
                repo = pathname.split('/')[1] || `${user}.github.io`;
            }

            // GitHub API endpoint to list root directory contents
            const apiUrl = `https://github.com{user}/${repo}/contents/`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to fetch repository structure');
                
                const items = await response.json();
                let projectCount = 0;

                for (const item of items) {
                    // Filter for directories only
                    if (item.type === 'dir') {
                        // Check if this directory contains an index.html file
                        const checkIndexUrl = `https://github.com{user}/${repo}/contents/${item.path}`;
                        const dirResponse = await fetch(checkIndexUrl);
                        
                        if (dirResponse.ok) {
                            const dirItems = await dirResponse.json();
                            const hasIndex = dirItems.some(f => f.name.toLowerCase() === 'index.html');

                            if (hasIndex) {
                                projectCount++;
                                const li = document.createElement('li');
                                li.innerHTML = `
                                    <a href="./${item.path}/">
                                        <span>${item.name}</span>
                                        <span class="arrow">→</span>
                                    </a>
                                `;
                                listEl.appendChild(li);
                            }
                        }
                    }
                }

                statusEl.textContent = projectCount > 0 
                    ? `Found ${projectCount} active project prototypes` 
                    : "No project directories with index.html found.";

            } catch (error) {
                console.error(error);
                statusEl.textContent = "Error loading projects. Check console for details.";
            }
        }

        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>
</body>
</html>
